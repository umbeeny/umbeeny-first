                    { title: 'Mac용 V3 라이센스 제공 가능 여부 문의', category: 'AI/IT도구', department: '정보기술팀', content: 'SKT 프로젝트 맥북 사용자 보안 필수 V3 설치로 불필요한 윈도우 설치 강제 해결 요청.', feedback: '필요 인원을 확인한 후 라이선스 제공 가능 여부를 검토하여 공지드리겠습니다.' }
                ]
            },
            {
                id: '2026-10',
                month: '2026년 10월',
                date: '2026년 10월 19일 (월)',
                location: '1층 대회의실',
                attendance: '15명 중 11명 참석 (73.3%)',
                bestAgenda: '5-2. AI 비용 지원 금액 상향 건의',
                agendas: [
                    { title: '기숙사 차량 차단봉 권한 완화 건의', category: '시설/수리', department: '경영지원실', content: '기숙사 철거로, 차량 미등록자도 퇴거를 위해 차량 이동이 필요한 상황. 차단봉 이용 자율화 건의.', feedback: '업무시간 외 관리인 부재로 자율화는 어려우나 사전 신청 인원에게는 리모컨을 대여해드릴 예정입니다.' },
                    { title: '텀블러 세척기 설치 건의', category: '시설/수리', department: '경영지원실', content: '위생 및 편의성 개선을 위한 텀블러 전용 세척기 설치 건의.', feedback: '세면대 도기 재질로 타공형 설치가 불가능하며, 무타공형은 고가 및 관리상 어려움으로 도입이 어렵습니다.' },
                    { title: '조식 식사 다양화(종류 변경) 건의', category: '식당/카페테리아', department: '경영지원실', content: '단가 차이가 크게 없는 선에서 라면(진라면→신라면/열라면) 및 잼(딸기잼→포도잼/복숭아잼) 종류 변경/추가 제안.', feedback: '원활한 운영 관리를 위해 현재 제공 중인 메뉴의 변경 및 추가는 어려운 점 양해 부탁드립니다.' },
                    { title: '헬스장 기구(스미스머신) 고장으로 인한 교체 건의', category: '헬스장/휴게실', department: '경영지원실', content: '15년 이상 된 노후 스미스머신 좌우 무게 균형 불균형 등 잔고장 빈발로 교체 건의.', feedback: '확인 결과 이상은 없었으나 이용 시 불편 사항 점검을 위해 의견을 주신 분과 함께 추가 점검하겠습니다.' },
                    { title: 'AI 구독료 지원 관련 및 비용 지원 금액 상향 건의 (우수안건)', category: 'AI/IT도구', department: '정보기술팀', content: 'Pro($20) 한도 자주 도달하여 차액 본인 부담 또는 Max($110)로 지원 상향 건의.', feedback: '올해는 예산 범위 내 운영하며, 지원 금액·요금제·지원 프로세스에 대해 종합적으로 검토 중입니다.' },
                    { title: '대회의실 마이크 설치 요청 (지난 안건 Feedback)', category: '시설/수리', department: '경영지원실', content: '설명회 및 교육 등 인원 집중 시 마이크 설치 요청.', feedback: '회의 진행 시 조용한 환경인 점을 고려할 때 설치 필요성이 크지 않아 설치를 진행하지 않습니다.' },
                    { title: 'Mac용 V3 라이센스 제공 가능 여부 문의 (지난 안건 Feedback)', category: 'AI/IT도구', department: '정보기술팀', content: 'SKT 프로젝트 MacBook 사용자 보안 필수 V3 설치 관련.', feedback: 'Mac용 V3가 필요한 인원을 파악한 후 배포를 완료하였습니다.' }
                ]
            }
        ];

        const categories = ['전체', '노트북/장비', '에어컨/냉난방', '식당/카페테리아', '복지/휴가', '시설/수리', 'AI/IT도구', '헬스장/휴게실'];

        function App() {
            const [meetings, setMeetings] = useState(initialMeetings);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('전체');
            const [selectedMonth, setSelectedMonth] = useState('전체');
            const [viewMode, setViewMode] = useState('search');
            const [selectedAgenda, setSelectedAgenda] = useState(null);
            
            const [monthlySelectedMonth, setMonthlySelectedMonth] = useState('2026년 10월');

            const [isAdminModalOpen, setIsAdminModalOpen] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [isLoggedInAdmin, setIsLoggedInAdmin] = useState(false);

            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [isParsing, setIsParsing] = useState(false);
            const [pasteText, setPasteText] = useState('');
            
            const [parsedMeeting, setParsedMeeting] = useState({
                month: '2026년 11월',
                date: '',
                location: '1층 대회의실',
                attendance: '',
                bestAgenda: '',
                agendas: []
            });

            const handleGoHome = () => {
                setViewMode('search');
                setSelectedCategory('전체');
                setSelectedMonth('전체');
                setSearchTerm('');
            };

            const filteredAgendas = useMemo(() => {
                let list = [];
                meetings.forEach(m => {
                    if (selectedMonth !== '전체' && m.month !== selectedMonth) return;
                    m.agendas.forEach(a => {
                        list.push({ ...a, meetingMonth: m.month, meetingDate: m.date });
                    });
                });

                return list.filter(item => {
                    const matchesCategory = selectedCategory === '전체' || item.category === selectedCategory;
                    const query = searchTerm.toLowerCase();
                    const matchesSearch = !searchTerm || 
                        item.title.toLowerCase().includes(query) ||
                        item.content.toLowerCase().includes(query) ||
                        item.feedback.toLowerCase().includes(query) ||
                        item.department.toLowerCase().includes(query) ||
                        item.meetingMonth.toLowerCase().includes(query);
                    return matchesCategory && matchesSearch;
                });
            }, [meetings, searchTerm, selectedCategory, selectedMonth]);

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPassword === '2026') {
                    setIsLoggedInAdmin(true);
                    setIsAdminModalOpen(false);
                    setAdminPassword('');
                    setIsAddModalOpen(true);
                } else {
                    alert('비밀번호가 올바르지 않습니다.');
                }
            };

            const parseMeetingText = (text) => {
                const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
                
                let monthMatch = text.match(/202\d년\s*\d+월/);
                let month = monthMatch ? monthMatch[0] : '2026년 11월';
                
                let dateMatch = text.match(/일\s*시\s*\|\s*([^\n]+)/) || text.match(/(202\d년\s*\d+월\s*\d+일[^\n]*)/);
                let date = dateMatch ? dateMatch[1].trim() : '';

                let attMatch = text.match(/참\s*석\s*자\s*\|[^\n]*\n?([^\n]*참석[^\n]*)/) || text.match(/([0-9]+명\s*중[^\n]*참석[^\n]*)/);
                let attendance = attMatch ? attMatch[1].trim() : '';

                let bestMatch = text.match(/우수안건[^\n]*\|\s*([^\n]+)/);
                let bestAgenda = bestMatch ? bestMatch[1].trim() : '';

                let agendas = [];
                const agendaBlocks = text.split(/(?=\d+\.\s+)/);
                
                agendaBlocks.forEach(block => {
                    const titleMatch = block.match(/^\d+\.\s*([^\n]+)/);
                    if (titleMatch) {
                        let fullTitle = titleMatch[1].trim();
                        let feedback = '';
                        let fbMatch = block.match(/☞[^\n]*피드백:\s*([\s\S]*)/);
                        if (fbMatch) {
                            feedback = fbMatch[1].trim().replace(/\n/g, ' ');
                        }

                        let category = '시설/수리';
                        if (fullTitle.includes('에어컨') || fullTitle.includes('냉방') || fullTitle.includes('환기')) category = '에어컨/냉난방';
                        else if (fullTitle.includes('노트북') || fullTitle.includes('Wi-Fi') || fullTitle.includes('WiFi')) category = '노트북/장비';
                        else if (fullTitle.includes('식당') || fullTitle.includes('카페') || fullTitle.includes('음료') || fullTitle.includes('조식')) category = '식당/카페테리아';
                        else if (fullTitle.includes('휴가') || fullTitle.includes('지원') || fullTitle.includes('대출') || fullTitle.includes('회식')) category = '복지/휴가';
                        else if (fullTitle.includes('AI') || fullTitle.includes('앱') || fullTitle.includes('SW') || fullTitle.includes('V3')) category = 'AI/IT도구';
                        else if (fullTitle.includes('헬스장') || fullTitle.includes('휴게실') || fullTitle.includes('안마')) category = '헬스장/휴게실';

                        let dept = '경영지원실';
                        if (category === 'AI/IT도구' || category === '노트북/장비') dept = '정보기술팀';
                        if (category === '복지/휴가') dept = '경영관리실';

                        agendas.push({
                            title: fullTitle,
                            category,
                            department: dept,
                            content: block.replace(/^\d+\.\s*[^\n]+/, '').replace(/☞[\s\S]*/, '').trim(),
                            feedback: feedback || '주무부서 피드백을 확인 중입니다.'
                        });
                    }
                });

                if (agendas.length === 0) {
                    agendas.push({
                        title: '샘플 새로 추가된 안건',
                        category: '시설/수리',
                        department: '경영지원실',
                        content: text.slice(0, 150) + '...',
                        feedback: '주무부서 검토 중입니다.'
                    });
                }

                setParsedMeeting({
                    month,
                    date: date || `${month} 정기회의`,
                    location: '1층 대회의실',
                    attendance: attendance || '참석률 집계 중',
                    bestAgenda: bestAgenda || '검토 중',
                    agendas
                });
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsParsing(true);
                if (file.name.endsWith('.docx')) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        window.mammoth.extractRawText({ arrayBuffer: event.target.result })
                            .then((result) => {
                                parseMeetingText(result.value);
                                setIsParsing(false);
                            })
                            .catch((err) => {
                                alert('Word 파일 읽기 실패: ' + err.message);
                                setIsParsing(false);
                            });
                    };
                    reader.readAsArrayBuffer(file);
                } else {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        parseMeetingText(event.target.result);
                        setIsParsing(false);
                    };
                    reader.readAsText(file);
                }
            };

            const handleConfirmAddMeeting = () => {
                if (!parsedMeeting.agendas || parsedMeeting.agendas.length === 0) {
                    alert('추가할 안건이 없습니다.');
                    return;
                }

                const newMeetingObj = {
                    id: `meeting-${Date.now()}`,
                    ...parsedMeeting
                };

                setMeetings([newMeetingObj, ...meetings]);
                setIsAddModalOpen(false);
                setMonthlySelectedMonth(parsedMeeting.month);
                alert(`${parsedMeeting.month} 회의록이 성공적으로 등록되었습니다!`);
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 pb-16">
                    <header className="bg-indigo-900 text-white shadow-md">
                        <div className="max-w-6xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div onClick={handleGoHome} className="cursor-pointer group">
                                <span className="bg-indigo-700 text-indigo-100 text-xs px-2.5 py-1 rounded-full font-medium">GCC 위원회 공식 기록</span>
                                <h1 className="text-2xl md:text-3xl font-bold mt-1 group-hover:text-indigo-200 transition">
                                    GCC 회의록 통합 검색 🏠
                                </h1>
                                <p className="text-indigo-200 text-sm mt-1">2월부터 10월까지 모든 안건, 주무부서 피드백, 논의사항을 한눈에 검색하세요.</p>
                            </div>
                            
                            <div className="flex flex-wrap items-center gap-2">
                                <button 
                                    onClick={() => setViewMode('search')}
                                    className={`whitespace-nowrap px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold transition flex items-center gap-1.5 ${viewMode === 'search' ? 'bg-white text-indigo-900 shadow-md' : 'bg-indigo-800 text-white hover:bg-indigo-700'}`}>
                                    <span>🔍</span> 안건별 통합 검색
                                </button>
                                <button 
                                    onClick={() => setViewMode('monthly')}
                                    className={`whitespace-nowrap px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold transition flex items-center gap-1.5 ${viewMode === 'monthly' ? 'bg-white text-indigo-900 shadow-md' : 'bg-indigo-800 text-white hover:bg-indigo-700'}`}>
                                    <span>📁</span> 월별 회의록 보기
                                </button>
                                <button 
                                    onClick={() => {
                                        if (isLoggedInAdmin) {
                                            setIsAddModalOpen(true);
                                        } else {
                                            setIsAdminModalOpen(true);
                                        }
                                    }}
                                    className="whitespace-nowrap bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold shadow-md transition flex items-center gap-1.5">
                                    <span>🔒</span> 회의록/안건 추가
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 mt-8">
                        {viewMode === 'search' ? (
                            <div>
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6">
                                    <div className="relative mb-4">
                                        <input 
                                            type="text" 
                                            placeholder="검색어를 입력하세요 (예: 차단봉, 텀블러, 노트북, AI, 헬스장, 마이크...)"
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                            className="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-base"
                                        />
                                        <span className="absolute left-4 top-3.5 text-xl text-slate-400">🔍</span>
                                    </div>

                                    <div className="flex flex-wrap items-center gap-2 mb-3 pb-3 border-b border-slate-100">
                                        <span className="text-xs font-bold text-slate-500 mr-2">📅 월별:</span>
                                        {['전체', '2026년 2월', '2026년 3월', '2026년 4월', '2026년 5월', '2026년 6월', '2026년 7월', '2026년 8월', '2026년 9월', '2026년 10월'].map(m => (
                                            <button
                                                key={m}
                                                onClick={() => setSelectedMonth(m)}
                                                className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${selectedMonth === m ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                            >
                                                {m}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="flex flex-wrap items-center gap-2">
                                        <span className="text-xs font-bold text-slate-500 mr-2">🏷️ 주제별:</span>
                                        {categories.map(cat => (
                                            <button
                                                key={cat}
                                                onClick={() => setSelectedCategory(cat)}
                                                className={`px-3.5 py-1.5 rounded-full text-xs font-semibold transition ${selectedCategory === cat ? 'bg-slate-900 text-white shadow' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                            >
                                                #{cat}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="flex justify-between items-center mb-4">
                                    <p className="text-sm font-medium text-slate-600">
                                        검색 결과: <span className="font-bold text-indigo-600">{filteredAgendas.length}</span>건의 안건
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {filteredAgendas.map((item, idx) => (
                                        <div 
                                            key={idx} 
                                            onClick={() => setSelectedAgenda(item)}
                                            className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between group"
                                        >
                                            <div>
                                                <div className="flex justify-between items-start gap-2 mb-2">
                                                    <span className="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-md font-semibold">
                                                        {item.meetingMonth}
                                                    </span>
                                                    <span className="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md font-medium">
                                                        #{item.category}
                                                    </span>
                                                </div>
                                                <h3 className="font-bold text-slate-900 text-base group-hover:text-indigo-600 transition mb-2">
                                                    {item.title}
                                                </h3>
                                                <p className="text-xs text-slate-600 line-clamp-2 mb-4">
                                                    {item.content}
                                                </p>
                                            </div>
                                            <div className="pt-3 border-t border-slate-100 text-xs flex justify-between items-center text-slate-500">
                                                <span className="font-medium text-slate-700">담당 부서: {item.department}</span>
                                                <span className="text-indigo-600 font-semibold group-hover:translate-x-1 transition">상세 피드백 보기 →</span>
                                            </div>
                                        </div>
                                    ))}
                                    {filteredAgendas.length === 0 && (
                                        <div className="col-span-full py-16 text-center bg-white rounded-2xl border border-slate-200">
                                            <p className="text-slate-400 text-base">검색 결과가 없습니다. 다른 검색어를 입력해 보세요.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                                    <h3 className="text-sm font-bold text-slate-700 mb-3">📅 조회할 연도 및 월을 선택하세요</h3>
                                    <div className="flex flex-wrap gap-2">
                                        {meetings.map((m) => (
                                            <button
                                                key={m.id}
                                                onClick={() => setMonthlySelectedMonth(m.month)}
                                                className={`px-4 py-2 rounded-xl text-sm font-bold transition ${monthlySelectedMonth === m.month ? 'bg-indigo-600 text-white shadow' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                                            >
                                                {m.month} 정기회의
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {(() => {
                                    const m = meetings.find(item => item.month === monthlySelectedMonth);
                                    if (!m) return null;
                                    return (
                                        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                                            <div className="bg-slate-900 text-white p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
                                                <div>
                                                    <h2 className="text-xl font-bold">{m.month} 정기회의록</h2>
                                                    <p className="text-xs text-slate-300 mt-1">일시: {m.date} | 장소: {m.location} | 참석: {m.attendance}</p>
                                                </div>
                                                <span className="bg-amber-500 text-slate-950 font-bold text-xs px-3 py-1.5 rounded-full">
                                                    우수안건 포상: {m.bestAgenda}
                                                </span>
                                            </div>
                                            <div className="p-6 divide-y divide-slate-100">
                                                {m.agendas.map((a, i) => (
                                                    <div key={i} className="py-4 first:pt-0 last:pb-0">
                                                        <div className="flex items-center gap-2 mb-1">
                                                            <span className="text-xs bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-bold">#{a.category}</span>
                                                            <h4 className="font-semibold text-slate-900 text-base">{i+1}. {a.title} <span className="text-xs text-slate-500 font-normal ml-2">(주무부서: {a.department})</span></h4>
                                                        </div>
                                                        <p className="text-xs text-slate-600 mt-1.5 pl-4 border-l-2 border-slate-200">
                                                            <strong className="text-slate-700">요청/내용:</strong> {a.content}
                                                        </p>
                                                        <p className="text-xs text-indigo-800 mt-2 pl-4 border-l-2 border-indigo-400 bg-indigo-50/50 py-1.5 rounded-r">
                                                            <strong className="text-indigo-900">주무부서 피드백:</strong> {a.feedback}
                                                        </p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        )}
                    </main>

                    {isAdminModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl border border-slate-200">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-base font-bold text-slate-900">🔒 관리자 인증</h3>
                                    <button onClick={() => setIsAdminModalOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                                </div>
                                <p className="text-xs text-slate-500 mb-4">Word(.docx) 회의록 파일 자동 등록을 위해 관리자 비밀번호를 입력하세요. </p>
                                <form onSubmit={handleAdminLogin} className="space-y-4">
                                    <input 
                                        type="password" 
                                        placeholder="비밀번호 입력 (1234)" 
                                        value={adminPassword} 
                                        onChange={(e) => setAdminPassword(e.target.value)} 
                                        className="w-full p-3 border border-slate-300 rounded-xl bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                                        autoFocus
                                        required 
                                    />
                                    <div className="flex justify-end gap-2">
                                        <button type="button" onClick={() => setIsAdminModalOpen(false)} className="px-4 py-2 bg-slate-100 rounded-xl font-semibold text-slate-600 text-xs">취소</button>
                                        <button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-semibold text-xs hover:bg-indigo-500">확인</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {selectedAgenda && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
                            <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-xl border border-slate-200 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-start mb-4">
                                    <div>
                                        <span className="text-xs font-bold bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-md">{selectedAgenda.meetingMonth}</span>
                                        <span className="text-xs font-bold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md ml-2">#{selectedAgenda.category}</span>
                                    </div>
                                    <button 
                                        onClick={() => setSelectedAgenda(null)}
                                        className="text-slate-400 hover:text-slate-600 text-xl font-bold p-1">
                                        ✕
                                    </button>
                                </div>
                                <h2 className="text-xl font-bold text-slate-900 mb-4">{selectedAgenda.title}</h2>
                                
                                <div className="space-y-4 text-sm">
                                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                        <h4 className="font-bold text-slate-700 mb-1 text-xs uppercase tracking-wider">주무 부서 및 회의일</h4>
                                        <p className="text-slate-800 font-medium">{selectedAgenda.department} | {selectedAgenda.meetingDate}</p>
                                    </div>

                                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                        <h4 className="font-bold text-slate-700 mb-1 text-xs uppercase tracking-wider">요청 배경 및 안건 내용</h4>
                                        <p className="text-slate-800 leading-relaxed whitespace-pre-wrap">{selectedAgenda.content}</p>
                                    </div>

                                    <div className="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                                        <h4 className="font-bold text-indigo-900 mb-1 text-xs uppercase tracking-wider">주무부서 Direct 피드백</h4>
                                        <p className="text-indigo-950 leading-relaxed whitespace-pre-wrap">{selectedAgenda.feedback}</p>
                                    </div>
                                </div>

                                <div className="mt-6 flex justify-end gap-2">
                                    <button 
                                        onClick={() => {
                                            navigator.clipboard.writeText(`[${selectedAgenda.meetingMonth}] ${selectedAgenda.title}\n- 주무부서: ${selectedAgenda.department}\n- 내용: ${selectedAgenda.content}\n- 피드백: ${selectedAgenda.feedback}`);
                                            alert('안건 내용이 클립보드에 복사되었습니다!');
                                        }}
                                        className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-semibold transition">
                                        📋 내용 복사하기
                                    </button>
                                    <button 
                                        onClick={() => setSelectedAgenda(null)}
                                        className="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-xl text-sm font-semibold transition">
                                        닫기
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isAddModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-xl border border-slate-200 max-h-[95vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-lg font-bold text-slate-900">📄 Word(.docx) 회의록 자동 업로드 및 등록</h2>
                                    <button onClick={() => setIsAddModalOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                                </div>

                                <div className="mb-6 p-4 bg-indigo-50 rounded-xl border border-indigo-100">
                                    <label className="block text-xs font-bold text-indigo-900 mb-2">
                                        1. Word 회의록 파일(.docx) 선택 시 자동으로 안건이 추출됩니다:
                                    </label>
                                    <input 
                                        type="file" 
                                        accept=".docx, .txt" 
                                        onChange={handleFileUpload} 
                                        className="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer"
                                    />
                                    {isParsing && <p className="text-xs text-indigo-600 font-bold mt-2">⏳ 회의록 내용을 분석하는 중입니다...</p>}
                                </div>

                                <div className="mb-4">
                                    <label className="block text-xs font-bold text-slate-700 mb-1">또는 텍스트 직접 붙여넣기:</label>
                                    <textarea 
                                        rows="3" 
                                        placeholder="회의록 전체 내용을 여기에 붙여넣은 뒤 [내용 분석하기]를 누르세요." 
                                        value={pasteText} 
                                        onChange={(e) => setPasteText(e.target.value)} 
                                        className="w-full p-2.5 border border-slate-300 rounded-xl text-xs bg-slate-50"
                                    ></textarea>
                                    <button 
                                        type="button" 
                                        onClick={() => parseMeetingText(pasteText)}
                                        className="mt-1.5 px-3 py-1.5 bg-slate-800 text-white rounded-lg text-xs font-bold hover:bg-slate-700">
                                        ⚡ 붙여넣은 내용 분석하기
                                    </button>
                                </div>

                                {parsedMeeting.agendas.length > 0 && (
                                    <div className="space-y-4 pt-4 border-t border-slate-200">
                                        <h3 className="text-sm font-bold text-slate-900">2. 분석 결과 확인 및 수정</h3>
                                        <div className="grid grid-cols-2 gap-3 text-xs">
                                            <div>
                                                <span className="font-bold text-slate-600">회의 월:</span>
                                                <input 
                                                    type="text" 
                                                    value={parsedMeeting.month} 
                                                    onChange={(e) => setParsedMeeting({ ...parsedMeeting, month: e.target.value })} 
                                                    className="w-full mt-1 p-2 border border-slate-300 rounded-lg"
                                                />
                                            </div>
                                            <div>
                                                <span className="font-bold text-slate-600">우수 안건:</span>
                                                <input 
                                                    type="text" 
                                                    value={parsedMeeting.bestAgenda} 
                                                    onChange={(e) => setParsedMeeting({ ...parsedMeeting, bestAgenda: e.target.value })} 
                                                    className="w-full mt-1 p-2 border border-slate-300 rounded-lg"
                                                />
                                            </div>
                                        </div>

                                        <div className="max-h-60 overflow-y-auto space-y-3 pr-1">
                                            <span className="text-xs font-bold text-slate-700">추출된 안건 ({parsedMeeting.agendas.length}건):</span>
                                            {parsedMeeting.agendas.map((ag, idx) => (
                                                <div key={idx} className="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2 text-xs">
                                                    <input 
                                                        type="text" 
                                                        value={ag.title} 
                                                        onChange={(e) => {
                                                            const updated = [...parsedMeeting.agendas];
                                                            updated[idx].title = e.target.value;
                                                            setParsedMeeting({ ...parsedMeeting, agendas: updated });
                                                        }}
                                                        className="w-full font-bold p-1.5 bg-white border border-slate-300 rounded"
                                                    />
                                                    <div className="grid grid-cols-2 gap-2">
                                                        <select 
                                                            value={ag.category} 
                                                            onChange={(e) => {
                                                                const updated = [...parsedMeeting.agendas];
                                                                updated[idx].category = e.target.value;
                                                                setParsedMeeting({ ...parsedMeeting, agendas: updated });
                                                            }}
                                                            className="p-1 border rounded bg-white"
                                                        >
                                                            {categories.filter(c => c !== '전체').map(c => <option key={c} value={c}>{c}</option>)}
                                                        </select>
                                                        <input 
                                                            type="text" 
                                                            value={ag.department} 
                                                            onChange={(e) => {
                                                                const updated = [...parsedMeeting.agendas];
                                                                updated[idx].department = e.target.value;
                                                                setParsedMeeting({ ...parsedMeeting, agendas: updated });
                                                            }}
                                                            className="p-1 border rounded bg-white"
                                                            placeholder="담당 부서"
                                                        />
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="flex justify-end gap-2 pt-2">
                                            <button type="button" onClick={() => setIsAddModalOpen(false)} className="px-4 py-2 bg-slate-100 rounded-xl font-semibold text-slate-600 text-xs">취소</button>
                                            <button type="button" onClick={handleConfirmAddMeeting} className="px-5 py-2 bg-emerald-600 text-white rounded-xl font-semibold text-xs hover:bg-emerald-500">최종 회의록에 등록하기</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
